name: Deploy WolePass

on:
  push:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 – Run Laravel migrations against GCP DB
  # ─────────────────────────────────────────────
  migrate:
    name: Database Migrations (GCP MySQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./wolepass-core

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, gd, json, pdo, mysqli
          coverage: none

      - name: Install Composer Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --optimize-autoloader

      - name: Write .env file
        run: |
          cp .env.example .env
          sed -i "s|DB_CONNECTION=.*|DB_CONNECTION=mysql|" .env
          sed -i "s|# DB_HOST=.*|DB_HOST=${{ secrets.GCP_DB_HOST }}|" .env
          sed -i "s|# DB_PORT=.*|DB_PORT=3306|" .env
          sed -i "s|# DB_DATABASE=.*|DB_DATABASE=${{ secrets.GCP_DB_DATABASE }}|" .env
          sed -i "s|# DB_USERNAME=.*|DB_USERNAME=${{ secrets.GCP_DB_USERNAME }}|" .env
          sed -i "s|# DB_PASSWORD=.*|DB_PASSWORD=${{ secrets.GCP_DB_PASSWORD }}|" .env
          php artisan key:generate --force

      - name: Test TCP Connectivity to DB
        run: |
          echo "Testing connection to ${{ secrets.GCP_DB_HOST }}:3306 ..."
          timeout 10 bash -c 'cat < /dev/null > /dev/tcp/${{ secrets.GCP_DB_HOST }}/3306' \
            && echo "TCP connection SUCCESS" \
            || (echo "TCP connection FAILED - check GCP authorized networks" && exit 1)

      - name: Run Migrations
        run: php artisan migrate --force -v

  # ─────────────────────────────────────────────
  # JOB 2 – Deploy backend to Go54 shared hosting
  # ─────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend to komunisconcept.org.ng
    runs-on: ubuntu-latest
    needs: migrate

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, pdo_mysql
          coverage: none

      - name: Install Composer Dependencies (no dev)
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --optimize-autoloader --no-dev
        working-directory: ./wolepass-core

      - name: Deploy via rsync over SSH
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude='.env' --exclude='storage/logs/' --exclude='storage/app/' --exclude='.git'
          path: wolepass-core/
          remote_path: ${{ secrets.SSH_REMOTE_PATH }}
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Run post-deploy commands on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.SSH_REMOTE_PATH }}
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

name: Database Migrations

on:
  push:
    branches:
      - main

jobs:
  migrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./wolepass-core
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, dom, filter, gd, iconv, json, mbstring, pdo, pdo_mysql
          coverage: none

      - name: Install Composer Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --optimize-autoloader

      - name: Run Database Migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: ${{ secrets.GCP_DB_HOST }}
          DB_PORT: 3306
          DB_DATABASE: ${{ secrets.GCP_DB_DATABASE }}
          DB_USERNAME: ${{ secrets.GCP_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.GCP_DB_PASSWORD }}
        run: php artisan migrate --force

name: Deploy WolePass to Google Cloud

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: wolepass
  REGION: africa-south1
  SERVICE_NAME: wolepass-api
  REPOSITORY: wolepass
  REGISTRY: africa-south1-docker.pkg.dev

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1 – Build Docker image and push to Artifact Registry
  # ─────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build and Push Docker Image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          docker build -t "$IMAGE" -t "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:latest" .
          docker push "$IMAGE"
          docker push "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:latest"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

  # ─────────────────────────────────────────────────────────────
  # JOB 2 – Run Laravel migrations via Cloud Run Job
  # ─────────────────────────────────────────────────────────────
  migrate:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Run Migrations via Cloud Run Job
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          gcloud run jobs create migrate-job-${{ github.run_number }} \
            --image="$IMAGE" \
            --region=${{ env.REGION }} \
            --set-cloudsql-instances=${{ secrets.GCP_CLOUDSQL_CONNECTION_NAME }} \
            --set-env-vars="APP_NAME=WolePass" \
            --set-env-vars="APP_ENV=production" \
            --set-env-vars="APP_DEBUG=false" \
            --set-env-vars="APP_URL=${{ secrets.APP_URL }}" \
            --set-env-vars="DB_CONNECTION=mysql" \
            --set-env-vars="DB_SOCKET=/cloudsql/${{ secrets.GCP_CLOUDSQL_CONNECTION_NAME }}" \
            --set-env-vars="DB_HOST=127.0.0.1" \
            --set-env-vars="DB_DATABASE=${{ secrets.GCP_DB_DATABASE }}" \
            --set-env-vars="DB_USERNAME=${{ secrets.GCP_DB_USERNAME }}" \
            --set-env-vars="DB_PASSWORD=${{ secrets.GCP_DB_PASSWORD }}" \
            --set-env-vars="APP_KEY=${{ secrets.APP_KEY }}" \
            --set-env-vars="PAYSTACK_PUBLIC_KEY=${{ secrets.PAYSTACK_PUBLIC_KEY }}" \
            --set-env-vars="PAYSTACK_SECRET_KEY=${{ secrets.PAYSTACK_SECRET_KEY }}" \
            --command="php" \
            --args="artisan,migrate,--force" \
            --max-retries=1 \
            --task-timeout=120 \
            --project=${{ env.PROJECT_ID }}
          
          gcloud run jobs execute migrate-job-${{ github.run_number }} \
            --region=${{ env.REGION }} \
            --wait \
            --project=${{ env.PROJECT_ID }}

  # ─────────────────────────────────────────────────────────────
  # JOB 3 – Deploy updated image to Cloud Run service
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: migrate

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          project_id: ${{ env.PROJECT_ID }}
          env_vars: |
            APP_NAME=WolePass
            APP_ENV=production
            APP_DEBUG=false
            APP_URL=${{ secrets.APP_URL }}
            DB_CONNECTION=mysql
            DB_SOCKET=/cloudsql/${{ secrets.GCP_CLOUDSQL_CONNECTION_NAME }}
            DB_HOST=127.0.0.1
            DB_DATABASE=${{ secrets.GCP_DB_DATABASE }}
            DB_USERNAME=${{ secrets.GCP_DB_USERNAME }}
            DB_PASSWORD=${{ secrets.GCP_DB_PASSWORD }}
            APP_KEY=${{ secrets.APP_KEY }}
            SESSION_DRIVER=database
            CACHE_STORE=database
            QUEUE_CONNECTION=database
            PAYSTACK_PUBLIC_KEY=${{ secrets.PAYSTACK_PUBLIC_KEY }}
            PAYSTACK_SECRET_KEY=${{ secrets.PAYSTACK_SECRET_KEY }}
          flags: |
            --allow-unauthenticated
            --add-cloudsql-instances=${{ secrets.GCP_CLOUDSQL_CONNECTION_NAME }}
            --min-instances=0
            --max-instances=10
            --memory=512Mi
            --cpu=1
            --port=8080

      - name: Print Cloud Run URL
        run: |
          echo "✅ Deployed successfully!"
          echo "🌐 API URL: ${{ steps.deploy.outputs.url }}"
          echo "Update your frontend VITE_API_BASE_URL to: ${{ steps.deploy.outputs.url }}/api"
